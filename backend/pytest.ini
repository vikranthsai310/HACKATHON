[pytest]
# Pytest configuration for HRM Decision System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = .

# Files to ignore during collection
norecursedirs = app venv env .git __pycache__ .pytest_cache htmlcov node_modules

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (test component interactions)
    functional: Functional tests (test business logic)
    api: API endpoint tests
    performance: Performance and load tests
    slow: Tests that take a long time to run
    smoke: Quick smoke tests for basic functionality

# Coverage options (if using pytest-cov)
# [coverage:run]
# source = app/
# omit = 
#     */tests/*
#     */test_*.py

# Console output options
console_output_style = progress

# Log options
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Asyncio mode (if using async tests)
asyncio_mode = auto
